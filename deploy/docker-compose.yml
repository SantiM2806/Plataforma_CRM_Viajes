# Stack completo de la app: postgres + redis + web (+ caddy) (+ worker en Fase 1).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelkit_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # exponer solo si necesitas acceso externo; en prod, quítalo

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # worker: se activa en Fase 1 (cotización paralela, TRM BanRep, webhooks).
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: deploy/worker.Dockerfile
  #   restart: unless-stopped
  #   env_file:
  #     - ../.env
  #   depends_on:
  #     - postgres
  #     - redis

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
